<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,
initial-scale=1.0,
maximum-scale=1.0,
user-scalable=no">

<title>Happy Birthday 🎂</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html,body{

    width:100%;
    height:100%;

    overflow:hidden;

    background:#000;

    font-family:Arial,
    Helvetica,
    sans-serif;
}

body{
    position:relative;
}


/* =====================================================
   APP
===================================================== */

#app{

    position:fixed;
    inset:0;

    overflow:hidden;

    background:
    radial-gradient(
        circle at center,
        rgba(255,20,147,.14),
        transparent 45%
    ),
    #000;
}


/* =====================================================
   ROTATE SCREEN
===================================================== */

#rotateScreen{

    position:fixed;
    inset:0;

    z-index:500;

    display:flex;

    align-items:center;
    justify-content:center;

    flex-direction:column;

    background:#000;

    color:#ff69b4;

    text-align:center;
}

.rotateIcon{

    font-size:70px;

    margin-bottom:20px;

    animation:
    rotatePhone 1.5s infinite;

    text-shadow:
    0 0 15px #ff1493,
    0 0 35px #ff1493;
}

.rotateTitle{

    font-size:25px;

    font-weight:bold;

    letter-spacing:2px;

    text-shadow:
    0 0 10px #ff1493,
    0 0 25px #ff1493;
}

.rotateText{

    margin-top:12px;

    font-size:14px;

    color:#ffb6dc;

    letter-spacing:2px;
}

@keyframes rotatePhone{

    0%{
        transform:rotate(0deg);
    }

    50%{
        transform:rotate(90deg);
    }

    100%{
        transform:rotate(90deg);
    }
}


/* =====================================================
   NAME SCREEN
===================================================== */

#nameScreen{

    position:fixed;
    inset:0;

    z-index:400;

    display:none;

    align-items:center;
    justify-content:center;

    flex-direction:column;

    background:
    radial-gradient(
        circle,
        rgba(255,20,147,.13),
        #000 70%
    );
}

.nameTitle{

    color:#ff69b4;

    font-size:
    clamp(24px,4vw,42px);

    font-weight:900;

    text-shadow:
    0 0 10px #ff1493,
    0 0 30px #ff1493;

    margin-bottom:25px;
}

.nameBox{

    width:
    min(420px,75vw);

    padding:15px 20px;

    border-radius:30px;

    border:
    1px solid
    rgba(255,105,180,.7);

    background:
    rgba(0,0,0,.65);

    color:#fff;

    font-size:18px;

    outline:none;

    text-align:center;

    box-shadow:
    0 0 20px
    rgba(255,20,147,.35);
}

.nameBox::placeholder{
    color:#ffb6dc;
}

.generateBtn{

    margin-top:18px;

    padding:13px 28px;

    border:none;

    border-radius:30px;

    background:
    linear-gradient(
        90deg,
        #ff1493,
        #ff69b4
    );

    color:white;

    font-size:16px;

    font-weight:bold;

    cursor:pointer;

    box-shadow:
    0 0 20px
    rgba(255,20,147,.5);
}

.generateBtn:active{
    transform:scale(.96);
}


/* =====================================================
   LINK BOX
===================================================== */

#linkBox{

    display:none;

    width:
    min(500px,80vw);

    margin-top:20px;

    text-align:center;
}

.linkText{

    color:#ffb6dc;

    font-size:13px;

    margin-bottom:10px;
}

.generatedLink{

    width:100%;

    padding:10px;

    border-radius:20px;

    border:
    1px solid
    rgba(255,105,180,.5);

    background:#080008;

    color:#ff69b4;

    text-align:center;

    font-size:12px;
}


/* =====================================================
   COPY BUTTON
===================================================== */

.copyBtn{

    margin-top:10px;

    padding:10px 22px;

    border:none;

    border-radius:20px;

    background:
    linear-gradient(
        90deg,
        #ff1493,
        #ff69b4
    );

    color:#fff;

    font-size:14px;

    font-weight:bold;

    cursor:pointer;

    box-shadow:
    0 0 15px
    rgba(255,20,147,.45);

}

.copyBtn:active{

    transform:scale(.95);

}


/* =====================================================
   MATRIX
===================================================== */

#matrixCanvas{

    position:absolute;

    inset:0;

    width:100%;
    height:100%;

    z-index:1;
}


/* =====================================================
   DARK OVERLAY
===================================================== */

#darkOverlay{

    position:absolute;

    inset:0;

    z-index:2;

    pointer-events:none;

    background:
    radial-gradient(
        ellipse at center,
        transparent 10%,
        rgba(0,0,0,.25) 65%,
        rgba(0,0,0,.72) 100%
    );
}


/* =====================================================
   CENTER GLOW
===================================================== */

.centerGlow{

    position:absolute;

    width:480px;
    height:480px;

    left:50%;
    top:50%;

    transform:
    translate(-50%,-50%);

    z-index:3;

    pointer-events:none;

    background:
    radial-gradient(
        circle,
        rgba(255,20,147,.13),
        transparent 70%
    );
}


/* =====================================================
   PARTICLE CANVAS
===================================================== */

#particleCanvas{

    position:absolute;

    inset:0;

    width:100%;
    height:100%;

    z-index:10;

    pointer-events:none;
}


/* =====================================================
   COUNTDOWN
===================================================== */

#countdownScreen{

    position:absolute;

    inset:0;

    z-index:50;

    display:flex;

    flex-direction:column;

    align-items:center;

    justify-content:center;

    background:
    rgba(0,0,0,.90);

    transition:
    opacity .8s ease,
    visibility .8s ease;
}

#countdownNumber{

    font-size:
    clamp(90px,20vw,180px);

    font-weight:900;

    color:#ff69b4;

    text-shadow:

    0 0 10px #ff1493,

    0 0 30px #ff1493,

    0 0 70px #ff1493,

    0 0 120px #ff1493;
}

.countText{

    margin-top:15px;

    color:#ffb6dc;

    font-size:14px;

    letter-spacing:5px;

    text-transform:uppercase;
}

.hide{

    opacity:0 !important;

    visibility:hidden !important;
}


/* =====================================================
   BUTTONS
===================================================== */

.controls{

    position:absolute;

    right:20px;

    bottom:20px;

    z-index:100;

    display:flex;

    gap:12px;
}

.controlBtn{

    width:48px;
    height:48px;

    border-radius:50%;

    border:
    1px solid
    rgba(255,105,180,.75);

    background:
    rgba(0,0,0,.58);

    color:#ff69b4;

    font-size:21px;

    display:flex;

    align-items:center;
    justify-content:center;

    cursor:pointer;
}


/* =====================================================
   VIDEO
===================================================== */

#birthdayVideo{

    position:absolute;

    inset:0;

    width:100%;
    height:100%;

    object-fit:cover;

    z-index:200;

    display:none;

    background:#000;
}


/* =====================================================
   ORIENTATION
===================================================== */

@media (orientation:portrait){

    #app{
        display:none;
    }

    #rotateScreen{
        display:flex;
    }

    #nameScreen{
        display:none;
    }
}

@media (orientation:landscape){

    #rotateScreen{
        display:none;
    }
}


/* =====================================================
   MOBILE
===================================================== */

@media(max-width:600px){

    .controls{

        right:12px;
        bottom:12px;
    }

    .controlBtn{

        width:43px;
        height:43px;

        font-size:18px;
    }
}

</style>

</head>


<body>


<!-- =====================================================
     ROTATE SCREEN
===================================================== -->

<div id="rotateScreen">

    <div class="rotateIcon">
        📱
    </div>

    <div class="rotateTitle">
        Rotate Your Phone
    </div>

    <div class="rotateText">
        Please rotate your phone to continue
    </div>

</div>


<!-- =====================================================
     NAME SCREEN
===================================================== -->

<div id="nameScreen">

    <div class="nameTitle">
        🎂 Birthday Wish 🎂
    </div>

    <input
        id="nameInput"
        class="nameBox"
        type="text"
        maxlength="20"
        placeholder="Enter Birthday Name">

    <button
        id="generateBtn"
        class="generateBtn">

        Generate Wish Link ✨

    </button>

    <div id="linkBox">

        <div class="linkText">
            Your birthday wish link:
        </div>

        <input
            id="generatedLink"
            class="generatedLink"
            readonly>

        <!-- COPY BUTTON -->

        <button
            id="copyBtn"
            class="copyBtn">

            📋 Copy Link

        </button>

    </div>

</div>


<!-- =====================================================
     APP
===================================================== -->

<div id="app">

    <canvas id="matrixCanvas"></canvas>

    <div id="darkOverlay"></div>

    <div class="centerGlow"></div>

    <canvas id="particleCanvas"></canvas>


    <!-- COUNTDOWN -->

    <div id="countdownScreen">

        <div id="countdownNumber">
            3
        </div>

        <div class="countText">
            Get Ready...
        </div>

    </div>


    <!-- CONTROLS -->

    <div class="controls">

        <button
            class="controlBtn"
            id="musicBtn">

            ♪

        </button>

        <button
            class="controlBtn"
            id="fullscreenBtn">

            ⛶

        </button>

    </div>


    <!-- VIDEO -->

    <video
        id="birthdayVideo"
        playsinline
        preload="auto">

        <source
            src="https://files.catbox.moe/wt3fex.mp4"
            type="video/mp4">

    </video>

</div>


<!-- =====================================================
     MUSIC
===================================================== -->

<audio
    id="birthdayAudio"
    loop
    preload="auto">

    <source
        src="https://happybirthdaydeargift.vercel.app/music/happybirtday_uia.mp3"
        type="audio/mpeg">

</audio>


<script>

/* =====================================================
   NAME FROM URL
===================================================== */

const params =
new URLSearchParams(
    window.location.search
);

const urlName =
params.get("name");

let birthdayName =
urlName
?
decodeURIComponent(urlName)
:
"";


/* =====================================================
   ELEMENTS
===================================================== */

const rotateScreen =
document.getElementById(
    "rotateScreen"
);

const nameScreen =
document.getElementById(
    "nameScreen"
);

const nameInput =
document.getElementById(
    "nameInput"
);

const generateBtn =
document.getElementById(
    "generateBtn"
);

const linkBox =
document.getElementById(
    "linkBox"
);

const generatedLink =
document.getElementById(
    "generatedLink"
);

const app =
document.getElementById(
    "app"
);


/* =====================================================
   ORIENTATION
===================================================== */

function isLandscape(){

    return (
        window.innerWidth >
        window.innerHeight
    );

}


function checkOrientation(){

    if(
        isLandscape()
    ){

        rotateScreen.style.display =
            "none";


        if(
            birthdayName
        ){

            nameScreen.style.display =
                "none";

            app.style.display =
                "block";

            startBirthdaySystem();

        }else{

            nameScreen.style.display =
                "flex";

            app.style.display =
                "none";

        }

    }else{

        rotateScreen.style.display =
            "flex";

        nameScreen.style.display =
            "none";

        app.style.display =
            "none";

    }

}


window.addEventListener(
    "resize",
    checkOrientation
);

window.addEventListener(
    "orientationchange",
    checkOrientation
);


/* =====================================================
   GENERATE LINK
===================================================== */

generateBtn.addEventListener(
    "click",
    function(){

        const name =
            nameInput.value.trim();


        if(!name){

            alert(
                "Please enter a name first."
            );

            return;

        }


        const baseURL =
            window.location.origin +
            window.location.pathname;


        const finalURL =
            baseURL +
            "?name=" +
            encodeURIComponent(name);


        generatedLink.value =
            finalURL;


        linkBox.style.display =
            "block";


        birthdayName =
            name;


        if(
            navigator.clipboard
        ){

            navigator.clipboard
            .writeText(finalURL)
            .catch(
                ()=>{}
            );

        }

    }
);


/* =====================================================
   ENTER KEY
===================================================== */

nameInput.addEventListener(
    "keydown",
    function(e){

        if(
            e.key === "Enter"
        ){

            generateBtn.click();

        }

    }
);


/* =====================================================
   COPY LINK
===================================================== */

const copyBtn =
    document.getElementById(
        "copyBtn"
    );


copyBtn.addEventListener(
    "click",
    async function(){

        const link =
            generatedLink.value.trim();


        if(!link){

            alert(
                "First generate a wish link."
            );

            return;

        }


        try{

            await navigator.clipboard.writeText(
                link
            );


            copyBtn.textContent =
                "✅ Copied!";


            setTimeout(
                function(){

                    copyBtn.textContent =
                        "📋 Copy Link";

                },
                1500
            );


        }catch(error){

            generatedLink.select();

            document.execCommand(
                "copy"
            );


            copyBtn.textContent =
                "✅ Copied!";


            setTimeout(
                function(){

                    copyBtn.textContent =
                        "📋 Copy Link";

                },
                1500
            );

        }

    }
);


/* =====================================================
   MATRIX
===================================================== */

const matrixCanvas =
document.getElementById(
    "matrixCanvas"
);

const mctx =
matrixCanvas.getContext(
    "2d"
);

let matrixWidth=0;
let matrixHeight=0;

const matrixFontSize=16;

let columns=0;
let drops=[];


function resizeMatrix(){

    const dpr =
        Math.min(
            window.devicePixelRatio || 1,
            2
        );


    matrixWidth =
        window.innerWidth;

    matrixHeight =
        window.innerHeight;


    matrixCanvas.width =
        matrixWidth*dpr;

    matrixCanvas.height =
        matrixHeight*dpr;


    matrixCanvas.style.width =
        matrixWidth+"px";

    matrixCanvas.style.height =
        matrixHeight+"px";


    mctx.setTransform(
        dpr,
        0,
        0,
        dpr,
        0,
        0
    );


    columns =
        Math.floor(
            matrixWidth/
            matrixFontSize
        )+1;


    drops=[];


    for(
        let i=0;
        i<columns;
        i++
    ){

        drops[i]=
            Math.random()*
            -matrixHeight/
            matrixFontSize;

    }

}


resizeMatrix();

window.addEventListener(
    "resize",
    resizeMatrix
);


/* =====================================================
   MATRIX CHAR
===================================================== */

function randomChar(){

    const words=[

        "HAPPY",

        "BIRTHDAY",

        "TO",

        birthdayName || "YOU"

    ];


    const word =
        words[
            Math.floor(
                Math.random()*
                words.length
            )
        ];


    return word[
        Math.floor(
            Math.random()*
            word.length
        )
    ];

}


/* =====================================================
   MATRIX ANIMATION
===================================================== */

function drawMatrix(){

    mctx.fillStyle =
        "rgba(0,0,0,.075)";


    mctx.fillRect(
        0,
        0,
        matrixWidth,
        matrixHeight
    );


    mctx.font =
        "bold "+
        matrixFontSize+
        "px monospace";


    for(
        let i=0;
        i<columns;
        i++
    ){

        const x =
            i*matrixFontSize;


        const y =
            drops[i]*
            matrixFontSize;


        const char =
            randomChar();


        const brightness =
            Math.random();


        mctx.fillStyle =
            brightness>.78
            ?
            "#ff69b4"
            :
            "rgba(255,20,147,.40)";


        mctx.shadowColor =
            "#ff1493";


        mctx.shadowBlur =
            brightness>.78
            ? 8
            : 2;


        mctx.fillText(
            char,
            x,
            y
        );


        mctx.shadowBlur=0;


        if(
            y>matrixHeight &&
            Math.random()>.965
        ){

            drops[i]=
                Math.random()*-20;

        }


        drops[i]+=
            .35+
            Math.random()*.55;

    }


    requestAnimationFrame(
        drawMatrix
    );

}


drawMatrix();


/* =====================================================
   PARTICLE CANVAS
===================================================== */

const particleCanvas =
document.getElementById(
    "particleCanvas"
);

const pctx =
particleCanvas.getContext(
    "2d"
);

let width=0;
let height=0;

let particles=[];


function resizeParticles(){

    const dpr =
        Math.min(
            window.devicePixelRatio || 1,
            2
        );


    width =
        window.innerWidth;

    height =
        window.innerHeight;


    particleCanvas.width =
        width*dpr;

    particleCanvas.height =
        height*dpr;


    particleCanvas.style.width =
        width+"px";

    particleCanvas.style.height =
        height+"px";


    pctx.setTransform(
        dpr,
        0,
        0,
        dpr,
        0,
        0
    );

}


resizeParticles();

window.addEventListener(
    "resize",
    resizeParticles
);


/* =====================================================
   TEXT POINTS
===================================================== */

function getTextPoints(text){

    const off =
        document.createElement(
            "canvas"
        );


    const ctx =
        off.getContext(
            "2d"
        );


    let fontSize;


    if(
        width<600
    ){

        fontSize=
            Math.min(
                width*.20,
                105
            );

    }else{

        fontSize=
            Math.min(
                width*.17,
                145
            );

    }


    off.width=width;
    off.height=250;


    ctx.clearRect(
        0,
        0,
        off.width,
        off.height
    );


    ctx.fillStyle="#fff";


    ctx.font=
        "900 "+
        fontSize+
        "px Arial Black, Arial, sans-serif";


    ctx.textAlign="center";

    ctx.textBaseline="middle";


    /*
       Automatically reduce long names
    */

    while(
        ctx.measureText(text).width >
        width*.82 &&
        fontSize>35
    ){

        fontSize-=3;


        ctx.font=
            "900 "+
            fontSize+
            "px Arial Black, Arial, sans-serif";

    }


    ctx.fillText(
        text,
        off.width/2,
        off.height/2
    );


    const image =
        ctx.getImageData(
            0,
            0,
            off.width,
            off.height
        );


    const points=[];


    /*
       FEWER DOTS
       BUT STILL CLEAR
    */

    const gap =
        width<600
        ? 4
        : 4.5;


    for(
        let y=0;
        y<off.height;
        y+=gap
    ){

        for(
            let x=0;
            x<off.width;
            x+=gap
        ){

            const px =
                Math.floor(x);

            const py =
                Math.floor(y);


            const index =
                (
                    py*
                    off.width+
                    px
                )*4;


            if(
                image.data[index+3]>100
            ){

                points.push({

                    x:x,

                    y:
                        y-
                        off.height/2+
                        height/2

                });

            }

        }

    }


    return points;

}


/* =====================================================
   HEART
===================================================== */

function getHeartPoints(){

    const points=[];


    const scale=
        Math.min(
            width,
            height
        )*.018;


    const cx=
        width/2;


    const cy=
        height/2+
        height*.13;


    for(
        let t=0;
        t<Math.PI*2;
        t+=.035
    ){

        const hx=
            16*
            Math.pow(
                Math.sin(t),
                3
            );


        const hy=
            13*Math.cos(t)
            -
            5*Math.cos(2*t)
            -
            2*Math.cos(3*t)
            -
            Math.cos(4*t);


        for(
            let r=.04;
            r<=1;
            r+=.035
        ){

            points.push({

                x:
                    cx+
                    hx*
                    scale*
                    r,

                y:
                    cy-
                    hy*
                    scale*
                    r

            });

        }

    }


    return points;

}


/* =====================================================
   PARTICLE CLASS
===================================================== */

class Particle{

    constructor(){

        this.x=
            Math.random()*width;

        this.y=
            Math.random()*height;


        this.targetX=
            width/2;

        this.targetY=
            height/2;


        this.size=
            Math.random()<.92
            ? 1.7
            : 2.4;


        this.alpha=
            .8+
            Math.random()*.2;


        /*
           FASTER ASSEMBLY
        */

        this.speed=
            .16+
            Math.random()*.04;


        this.phase=
            Math.random()*
            Math.PI*2;

    }


    update(){

        this.x+=
            (
                this.targetX-
                this.x
            )*
            this.speed;


        this.y+=
            (
                this.targetY-
                this.y
            )*
            this.speed;


        this.phase+=.035;

    }


    draw(){

        const pulse=
            1+
            Math.sin(
                this.phase
            )*.15;


        pctx.beginPath();


        pctx.arc(
            this.x,
            this.y,
            this.size*pulse,
            0,
            Math.PI*2
        );


        pctx.fillStyle=
            "rgba(255,105,180,"+
            this.alpha+
            ")";


        pctx.shadowColor=
            "#ff1493";


        pctx.shadowBlur=6;


        pctx.fill();


        pctx.shadowBlur=0;

    }

}


/* =====================================================
   SET TARGET
===================================================== */

function setTarget(points){

    if(
        !points ||
        !points.length
    ){

        return;

    }


    while(
        particles.length<
        points.length
    ){

        particles.push(
            new Particle()
        );

    }


    for(
        let i=0;
        i<particles.length;
        i++
    ){

        const target=
            points[
                i%points.length
            ];


        particles[i].targetX=
            target.x;


        particles[i].targetY=
            target.y;

    }

}


/* =====================================================
   PARTICLE ANIMATION
===================================================== */

function animateParticles(){

    pctx.clearRect(
        0,
        0,
        width,
        height
    );


    for(
        const particle
        of particles
    ){

        particle.update();

        particle.draw();

    }


    requestAnimationFrame(
        animateParticles
    );

}


animateParticles();


/* =====================================================
   FLOATING PARTICLES
===================================================== */

const floatingParticles=[];


for(
    let i=0;
    i<70;
    i++
){

    floatingParticles.push({

        x:
            Math.random()*width,

        y:
            Math.random()*height,

        speed:
            .2+
            Math.random()*.7,

        size:
            1+
            Math.random()*1.5,

        alpha:
            .2+
            Math.random()*.5

    });

}


function drawFloating(){

    for(
        const f
        of floatingParticles
    ){

        f.y-=f.speed;


        if(
            f.y<0
        ){

            f.y=height;

            f.x=
                Math.random()*width;

        }


        pctx.beginPath();


        pctx.arc(
            f.x,
            f.y,
            f.size,
            0,
            Math.PI*2
        );


        pctx.fillStyle=
            `rgba(
                255,
                105,
                180,
                ${f.alpha}
            )`;


        pctx.shadowColor=
            "#ff1493";


        pctx.shadowBlur=5;


        pctx.fill();


        pctx.shadowBlur=0;

    }


    requestAnimationFrame(
        drawFloating
    );

}


drawFloating();


/* =====================================================
   WAIT
===================================================== */

function wait(ms){

    return new Promise(
        resolve =>
            setTimeout(
                resolve,
                ms
            )
    );

}


/* =====================================================
   SHOW TEXT
===================================================== */

async function showText(text){

    const points=
        getTextPoints(text);


    setTarget(points);


    /*
       TIME FOR PARTICLES
       TO FORM THE WORD
    */

    await wait(1800);


    /*
       TEXT STAYS FULLY VISIBLE
       FOR 3 SECONDS
    */

    await wait(1500);

}


/* =====================================================
   BIRTHDAY SEQUENCE
===================================================== */

let birthdayStarted=false;


async function startBirthdaySystem(){

    if(
        birthdayStarted
    ){

        return;

    }


    birthdayStarted=true;


    const countdownScreen=
        document.getElementById(
            "countdownScreen"
        );


    const countdownNumber=
        document.getElementById(
            "countdownNumber"
        );


    let count=3;


    while(
        count>0
    ){

        countdownNumber.textContent=
            count;


        await wait(1000);

        count--;

    }


    countdownScreen.classList.add(
        "hide"
    );


    await wait(800);


    /*
       HAPPY
    */

    await showText(
        "HAPPY"
    );


    /*
       BIRTHDAY
    */

    await showText(
        "BIRTHDAY"
    );


    /*
       TO
    */

    await showText(
        "TO"
    );


    /*
       NAME
    */

    await showText(
        birthdayName
    );


    /*
       HEART
    */

    const heart=
        getHeartPoints();


    setTarget(
        heart
    );


    /*
       HEART FORMATION TIME
    */

    await wait(5500);


    /*
       VIDEO
    */

    const video=
        document.getElementById(
            "birthdayVideo"
        );


    video.style.display=
        "block";


    try{

        await video.play();

    }catch(error){

        console.log(
            "Video autoplay blocked:",
            error
        );

    }

}


/* =====================================================
   MUSIC
===================================================== */

const audio=
    document.getElementById(
        "birthdayAudio"
    );


const musicBtn=
    document.getElementById(
        "musicBtn"
    );


musicBtn.addEventListener(
    "click",
    async function(){

        if(
            audio.paused
        ){

            try{

                await audio.play();


                musicBtn.textContent=
                    "❚❚";

            }catch(error){

                alert(
                    "Music could not be played."
                );

            }

        }else{

            audio.pause();


            musicBtn.textContent=
                "♪";

        }

    }
);


/* =====================================================
   FULLSCREEN
===================================================== */

const fullscreenBtn=
    document.getElementById(
        "fullscreenBtn"
    );


fullscreenBtn.addEventListener(
    "click",
    async function(){

        try{

            if(
                !document.fullscreenElement
            ){

                await document
                    .documentElement
                    .requestFullscreen();

            }else{

                await document.exitFullscreen();

            }

        }catch(error){

            console.log(error);

        }

    }
);
